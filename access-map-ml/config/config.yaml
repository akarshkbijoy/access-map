# ============================================
# AccessMap ML — Master Configuration
# ============================================
# All hyperparameters and settings for the
# accessibility feature detection pipeline.
# ============================================

# --- Model Architecture ---
model:
  architecture: "yolov8s"       # Options: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  pretrained: true              # Start from COCO pre-trained weights
  weights: "yolov8s.pt"         # Pre-trained weight file
  num_classes: 10               # Number of accessibility feature classes
  input_size: 640               # Input image size (square)

# --- Detection Classes ---
# Class ID → Name mapping for the accessibility domain
classes:
  0: "wheelchair"
  1: "wheelchair_ramp"
  2: "elevator"
  3: "lift"
  4: "stairs"
  5: "accessible_parking"
  6: "accessible_bathroom"
  7: "grab_bar"
  8: "doorway"
  9: "tactile_paving"

# --- Training Configuration ---
training:
  epochs: 150                   # Maximum training epochs
  batch_size: 16                # Batch size (reduce if OOM)
  learning_rate: 0.001          # Initial learning rate
  optimizer: "AdamW"            # Optimizer: SGD, Adam, AdamW
  weight_decay: 0.0005          # L2 regularization
  patience: 30                  # Early stopping patience (epochs)
  freeze_backbone: 10           # Freeze first N layers (for small datasets)
  warmup_epochs: 5              # Learning rate warmup
  cos_lr: true                  # Cosine learning rate scheduler
  label_smoothing: 0.0          # Label smoothing factor
  split_ratio:                  # Train / Validation / Test split
    train: 0.70
    val: 0.15
    test: 0.15
  resume: false                 # Resume from last checkpoint
  seed: 42                      # Random seed for reproducibility

# --- Data Augmentation ---
# Built-in Ultralytics augmentation params + Albumentations
augmentation:
  # Geometric transforms
  horizontal_flip: 0.5          # Probability of horizontal flip
  vertical_flip: 0.0            # Probability of vertical flip (disabled for most scenes)
  rotation_range: 15            # Max rotation degrees (±)
  scale_range: [0.5, 1.5]       # Random scale factor range
  translate: 0.1                # Random translation fraction
  perspective: 0.0005           # Perspective distortion
  shear: 0.0                    # Shear angle

  # Photometric transforms
  brightness_range: [0.7, 1.3]  # Brightness multiplier range
  contrast_range: [0.8, 1.2]    # Contrast multiplier range
  hsv_h: 0.015                  # HSV hue augmentation fraction
  hsv_s: 0.7                    # HSV saturation augmentation fraction
  hsv_v: 0.4                    # HSV value augmentation fraction

  # Mosaic & Mixup (multi-image augmentation)
  mosaic: 1.0                   # Mosaic augmentation probability
  mixup: 0.1                    # Mixup augmentation probability
  copy_paste: 0.1               # Copy-paste augmentation probability

  # Albumentations extras (applied on top of built-in)
  albumentations:
    enabled: true
    rain: 0.05                  # Simulated rain probability
    fog: 0.05                   # Simulated fog probability
    clahe: 0.1                  # CLAHE histogram equalization
    blur: 0.01                  # Gaussian blur probability
    median_blur: 0.01           # Median blur probability
    grayscale: 0.02             # Random grayscale conversion

# --- Inference Configuration ---
inference:
  model_path: "models/best.pt"  # Trained stairs model
  confidence_threshold: 0.25    # Minimum confidence for detections
  iou_threshold: 0.45           # NMS IoU threshold
  max_detections: 100           # Max detections per image
  device: "cpu"                 # Device: cpu for local inference
  half_precision: false         # FP16 inference (GPU only)

# --- Severity Classification ---
# Step/stair count → severity mapping for barrier assessment
severity:
  step_count_ranges:
    low: [1, 2]                 # 1-2 steps = low barrier
    medium: [3, 5]              # 3-5 steps = medium barrier
    high: [6, 999]              # 6+ steps = high barrier
  
  # Spatial relationship distance thresholds (pixels)
  spatial:
    near_threshold: 200         # "Near" if within this pixel distance
    proximity_threshold: 500    # "In proximity" threshold

# --- API Server Configuration ---
api:
  host: "0.0.0.0"
  port: 8000
  max_upload_size_mb: 10        # Max image upload size
  cors_origins:                 # Allowed CORS origins
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "https://accessmap.example.com"
  rate_limit: 60                # Max requests per minute
  workers: 1                    # Uvicorn workers (1 for GPU)

# --- Model Export Configuration ---
export:
  formats:                      # Export formats
    - "onnx"
    - "tflite"
  onnx_opset: 17                # ONNX opset version
  quantize: false               # INT8 quantization
  half_precision: true          # FP16 export
  simplify: true                # ONNX graph simplification
  dynamic_batch: false          # Dynamic batch size in ONNX

# --- Logging ---
logging:
  level: "INFO"                 # DEBUG, INFO, WARNING, ERROR
  log_dir: "logs"               # Log file directory
  tensorboard: true             # Enable TensorBoard logging

# --- Paths ---
paths:
  data_dir: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  models_dir: "models"
  runs_dir: "runs"
  logs_dir: "logs"
