<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopNavBar -->
<nav class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-8 py-3 max-w-7xl mx-auto rounded-full mt-4 mx-4 bg-white/70 backdrop-blur-3xl dark:bg-slate-900/70 shadow-[0_20_40px_rgba(25,28,30,0.06)]">
<div class="flex items-center gap-8">
<span class="text-2xl font-black tracking-tighter text-slate-900 dark:text-white font-headline">Access Map</span>
<div class="hidden md:flex items-center gap-6">
<a class="font-['Plus_Jakarta_Sans'] text-sm tracking-tight transition-colors text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white" href="#">Explorer</a>

</div>
</div>
<div class="flex items-center gap-2">
<button class="p-2 hover:bg-white/50 dark:hover:bg-slate-800/50 rounded-full transition-all active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined text-slate-900 dark:text-white" data-icon="account_circle">account_circle</span>
</button>
</div>

<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-24 pb-12 px-6 relative overflow-hidden bg-abstract-map" data-alt="abstract blurred map with soft ethereal blue and white gradients and fluid organic shapes in a high-key lighting style">
<!-- Blur Overlay for the Map -->
<div class="absolute inset-0 backdrop-blur-[80px] z-0"></div>
<!-- Floating Frosted Glass Form Card -->
<section class="relative z-10 w-full max-w-2xl bg-white/70 backdrop-blur-3xl rounded-xl md:rounded-full p-8 md:p-16 shadow-[0_20px_40px_rgba(25,28,30,0.06)] glass-edge">
<div class="text-center mb-12">
<h1 class="text-on-background font-headline text-4xl md:text-5xl font-black tracking-tight mb-4">Add a New Location</h1>
<p class="text-on-surface-variant text-lg font-medium leading-relaxed max-w-md mx-auto">Join our community in shaping a more inclusive world.</p>
</div>
<form class="space-y-10">
<!-- Location Name Field -->
<div class="space-y-3">
<label class="block text-sm font-bold uppercase tracking-widest text-on-surface-variant px-6" for="location_name">Location Name</label>
<input class="w-full px-8 py-5 bg-surface-container-low/50 border-none rounded-full text-on-surface placeholder:text-outline focus:ring-2 focus:ring-secondary-container focus:bg-surface-container-lowest transition-all duration-300" id="location_name" placeholder="Enter venue or landmark name" type="text"/>
</div>
<!-- Category Dropdown -->
<div class="space-y-3">
<label class="block text-sm font-bold uppercase tracking-widest text-on-surface-variant px-6" for="category">Category</label>
<div class="relative">
<select class="w-full appearance-none px-8 py-5 bg-surface-container-low/50 border-none rounded-full text-on-surface focus:ring-2 focus:ring-secondary-container focus:bg-surface-container-lowest transition-all duration-300" id="category">
<option value="">Select a category</option>
<option value="restaurant">Restaurant &amp; Dining</option>
<option value="retail">Retail &amp; Shopping</option>
<option value="public">Public Space &amp; Parks</option>
<option value="medical">Healthcare</option>
<option value="transport">Transit Hub</option>
</select>
<span class="material-symbols-outlined absolute right-8 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Accessibility Features Bento-ish Grid -->
<div class="space-y-4">
<label class="block text-sm font-bold uppercase tracking-widest text-on-surface-variant px-6">Accessibility Features</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<label class="flex items-center gap-4 p-5 bg-surface-container-low/40 hover:bg-surface-container-low/80 rounded-full cursor-pointer transition-all active:scale-[0.98]">
<input class="w-6 h-6 rounded-full border-none bg-white text-secondary focus:ring-secondary-container" type="checkbox"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="accessible">accessible</span>
<span class="text-sm font-semibold">Ramp</span>
</div>
</label>
<label class="flex items-center gap-4 p-5 bg-surface-container-low/40 hover:bg-surface-container-low/80 rounded-full cursor-pointer transition-all active:scale-[0.98]">
<input class="w-6 h-6 rounded-full border-none bg-white text-secondary focus:ring-secondary-container" type="checkbox"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="elevator">elevator</span>
<span class="text-sm font-semibold">Elevator</span>
</div>
</label>
<label class="flex items-center gap-4 p-5 bg-surface-container-low/40 hover:bg-surface-container-low/80 rounded-full cursor-pointer transition-all active:scale-[0.98]">
<input class="w-6 h-6 rounded-full border-none bg-white text-secondary focus:ring-secondary-container" type="checkbox"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="alt_route">alt_route</span>
<span class="text-sm font-semibold">Tactile Paths</span>
</div>
</label>
<label class="flex items-center gap-4 p-5 bg-surface-container-low/40 hover:bg-surface-container-low/80 rounded-full cursor-pointer transition-all active:scale-[0.98]">
<input class="w-6 h-6 rounded-full border-none bg-white text-secondary focus:ring-secondary-container" type="checkbox"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="braille">blind</span>
<span class="text-sm font-semibold">Braille</span>
</div>
</label>
<label class="flex items-center gap-4 p-5 bg-surface-container-low/40 hover:bg-surface-container-low/80 rounded-full cursor-pointer transition-all active:scale-[0.98] md:col-span-2">
<input class="w-6 h-6 rounded-full border-none bg-white text-secondary focus:ring-secondary-container" type="checkbox"/>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="wc">wc</span>
<span class="text-sm font-semibold">Accessible Restroom</span>
</div>
</label>
</div>
</div>
<!-- Submit Button -->
<div class="pt-6">
<button class="w-full bg-secondary-container text-on-secondary-container font-headline font-black text-lg py-5 rounded-full hover:shadow-[0_10px_25px_rgba(186,230,253,0.4)] transition-all active:scale-95 duration-200" type="submit">
                        Contribute Location

</div>
